<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>محتوى الدرس</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal'; background: #f0f2f5; padding: 20px; }
        .lesson-card { background: white; border-radius: 15px; padding: 20px; margin-bottom: 20px; box-shadow: 0 5px 10px rgba(0,0,0,0.05); }
        .video-container { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 10px; margin-top: 15px; }
        .video-container iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border:0; }
        .pdf-link { display: inline-block; background: #1e3c72; color: white; padding: 10px 20px; border-radius: 10px; text-decoration: none; margin-top: 10px; }
    </style>
</head>
<body>
    <h2 id="cTitle" style="text-align:center; color:#1e3c72"></h2>
    <div id="contentList"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp(firebaseConfig);
        const urlParams = new URLSearchParams(window.location.search);
        const courseId = urlParams.get('id');

        firebase.database().ref('courses/' + courseId).on('value', snap => {
            const data = snap.val();
            document.getElementById('cTitle').innerText = data.name;
            const list = document.getElementById('contentList');
            list.innerHTML = '';
            
            if(data.items) {
                Object.values(data.items).forEach(item => {
                    let media = '';
                    if(item.type === 'video') {
                        // حماية بسيطة بمنع الاقتراحات وإخفاء اللوجو
                        const vidId = item.link.split('v=')[1] || item.link.split('/').pop();
                        media = `<div class="video-container"><iframe src="https://www.youtube.com/embed/${vidId}?rel=0&modestbranding=1&showinfo=0" allowfullscreen></iframe></div>`;
                    } else {
                        media = `<a href="${item.link}" target="_blank" class="pdf-btn pdf-link">فتح ملف الـ PDF <i class="fas fa-file-pdf"></i></a>`;
                    }
                    list.innerHTML += `<div class="lesson-card"><h3>${item.title}</h3>${media}</div>`;
                });
            }
        });
    </script>
</body>
</html>
