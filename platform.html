<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المنصة | حازم سالم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal'; background: #f4f7f6; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 5%; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .card { background: white; border-radius: 20px; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.05); transition: 0.3s; }
        .card:hover { transform: translateY(-10px); }
        .img { height: 160px; background-size: cover; background-position: center; position: relative; }
        .img::after { content: ''; position: absolute; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.3); }
        .info { padding: 20px; text-align: center; }
        .btn-pdf { display: block; background: #f0f2f5; padding: 12px; margin-top: 10px; border-radius: 12px; text-decoration: none; color: #333; font-weight: bold; transition: 0.2s; }
        .btn-pdf:hover { background: #1e3c72; color: white; }
        .lock { color: #ddd; cursor: pointer; font-size: 1.5rem; transition: 0.3s; }
        .lock:hover { color: #f1c40f; }
    </style>
</head>
<body>
    <header>
        <h2 id="hi" style="color:#1e3c72"></h2>
        <div class="lock" onclick="ask()"><i class="fas fa-lock"></i></div>
    </header>

    <div class="grid" id="grid"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp({apiKey: "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4", authDomain: "hazoma-60ed2.firebaseapp.com", databaseURL: "https://hazoma-60ed2-default-rtdb.firebaseio.com", projectId: "hazoma-60ed2", storageBucket: "hazoma-60ed2.firebasestorage.app", messagingSenderId: "962438384604", appId: "1:962438384604:web:52db16e5723a8f6d3bdd19", measurementId: "G-BWQ5CZR50F"});
        const db = firebase.database();
        const user = localStorage.getItem('zomaUser');
        if(!user) window.location.href="index.html";
        document.getElementById('hi').innerText = `يا مساء الجمال يا ${user.split(' ')[0]} ❤️`;

        const imgs = {
            "كيمياء": "https://images.unsplash.com/photo-1532187863486-abf9d39d9995?w=400",
            "فيزياء": "https://images.unsplash.com/photo-1636466484362-c1335599422f?w=400",
            "لغة عربية": "https://images.unsplash.com/photo-1588615419958-4171619c7032?w=400",
            "تربية دينية": "https://images.unsplash.com/photo-1542810634-71277d95dcbb?w=400",
            "رياضيات": "https://images.unsplash.com/photo-1509228468518-180dd48a542a?w=400",
            "أحياء": "https://images.unsplash.com/photo-1530026405186-ed1f139313f8?w=400"
        };

        db.ref('courses').on('value', snap => {
            const g = document.getElementById('grid'); g.innerHTML = '';
            snap.forEach(c => {
                const d = c.val(); let files = '';
                if(d.files) Object.values(d.files).forEach(f => {
                    files += `<a href="${f.link}" target="_blank" class="btn-pdf">${f.title} <i class="fas fa-file-pdf"></i></a>`;
                });
                const img = imgs[d.name] || "https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=400";
                g.innerHTML += `<div class="card"><div class="img" style="background-image:url('${img}')"></div><div class="info"><h3>${d.name}</h3>${files}</div></div>`;
            });
        });

        function ask() { if(prompt("شفرة حازم سالم السرية:") === "Zoma1151946") window.location.href="admin.html"; }
    </script>
</body>
</html>
