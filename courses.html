<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>الكورسات | حازم سالم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal'; background: #f0f2f5; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 5%; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .course-card { background: white; border-radius: 25px; overflow: hidden; transition: 0.3s; cursor: pointer; text-align: center; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .course-card:hover { transform: translateY(-10px); box-shadow: 0 15px 30px rgba(0,0,0,0.1); }
        .img-box { height: 150px; display: flex; align-items: center; justify-content: center; font-size: 4rem; color: white; background: #1a2a6c; }
        .info { padding: 20px; }
        .lock { color: #eee; cursor: pointer; font-size: 1.5rem; transition: 0.3s; }
        .lock:hover { color: #fdbb2d; }
    </style>
</head>
<body>
    <header>
        <h2 id="welcome">أهلاً بك</h2>
        <div class="lock" onclick="toAdmin()"><i class="fas fa-lock"></i></div>
    </header>
    <div class="grid" id="courseGrid"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp({apiKey: "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4", authDomain: "hazoma-60ed2.firebaseapp.com", databaseURL: "https://hazoma-60ed2-default-rtdb.firebaseio.com", projectId: "hazoma-60ed2", storageBucket: "hazoma-60ed2.firebasestorage.app", messagingSenderId: "962438384604", appId: "1:962438384604:web:52db16e5723a8f6d3bdd19", measurementId: "G-BWQ5CZR50F"});
        const user = localStorage.getItem('zoma_user');
        if(!user) window.location.href="index.html";
        document.getElementById('welcome').innerText = `يا مساء الجمال يا ${user.split(' ')[0]} ❤️`;

        const icons = { "كيمياء": "flask", "فيزياء": "atom", "عربي": "pen-nib", "دين": "book-quran", "رياضيات": "calculator", "أحياء": "dna" };
        const colors = ["#1e3c72", "#2c3e50", "#27ae60", "#8e44ad", "#d35400", "#c0392b"];

        firebase.database().ref('courses').on('value', snap => {
            const grid = document.getElementById('courseGrid'); grid.innerHTML = '';
            let i = 0;
            snap.forEach(c => {
                const name = c.key;
                grid.innerHTML += `
                    <div class="course-card" onclick="location.href='content.html?c=${name}'">
                        <div class="img-box" style="background:${colors[i%6]}"><i class="fas fa-${icons[name] || 'book'}"></i></div>
                        <div class="info"><h3>${name}</h3><p>عرض المحتوى الدرسي</p></div>
                    </div>`;
                i++;
            });
        });
        function toAdmin() { if(prompt("شفرة حازم سالم السرية:") === "Zoma1151946") location.href="admin.html"; }
    </script>
</body>
</html>
