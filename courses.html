<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>المواد الدراسية | حازم سالم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal'; background: #f4f7f6; margin: 0; padding: 20px; }
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 5%; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 25px; margin-top: 30px; }
        .card { background: white; border-radius: 25px; overflow: hidden; cursor: pointer; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); text-align: center; }
        .card:hover { transform: translateY(-10px); }
        .img { height: 180px; background-size: cover; background-position: center; display: flex; align-items: center; justify-content: center; color: white; font-size: 3rem; position: relative; }
        .img::after { content:''; position:absolute; width:100%; height:100%; background:rgba(0,0,0,0.4); }
        .info { padding: 20px; }
        .info h3 { margin: 0; color: #1e3c72; }
    </style>
</head>
<body>
    <header>
        <h2 id="hi"></h2>
        <div style="color:#ccc; cursor:pointer" onclick="goAdmin()"><i class="fas fa-lock"></i></div>
    </header>
    <div class="grid" id="grid"></div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp(firebaseConfig); // استعمل نفس الكونفيج
        const db = firebase.database();
        document.getElementById('hi').innerText = `منور يا ${localStorage.getItem('zoma_user').split(' ')[0]} ❤️`;

        const icons = { "كيمياء": "flask", "فيزياء": "atom", "عربي": "pen-nib", "دين": "book-quran", "رياضيات": "calculator", "أحياء": "dna" };
        const imgs = { "كيمياء": "https://images.unsplash.com/photo-1532187863486-abf9d39d9995?w=400", "فيزياء": "https://images.unsplash.com/photo-1636466484362-c1335599422f?w=400" };

        db.ref('courses').on('value', snap => {
            const g = document.getElementById('grid'); g.innerHTML = '';
            snap.forEach(c => {
                const d = c.val();
                g.innerHTML += `
                    <div class="card" onclick="location.href='content.html?id=${c.key}'">
                        <div class="img" style="background-image:url('${imgs[d.name] || 'https://images.unsplash.com/photo-1497633762265-9d179a990aa6?w=400'}')">
                            <i class="fas fa-${icons[d.name] || 'book'}" style="z-index:1"></i>
                        </div>
                        <div class="info"><h3>${d.name}</h3><p>اضغط لاستعراض الدروس</p></div>
                    </div>`;
            });
        });
        function goAdmin() { if(prompt("الشفرة السرية:") === "Zoma1151946") location.href="admin.html"; }
    </script>
</body>
</html>
