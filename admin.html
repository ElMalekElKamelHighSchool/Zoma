<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | حازم سالم</title>
    <style>
        body { font-family: 'Tajawal'; background: #f4f7f6; padding: 20px; direction: rtl; }
        .box { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); max-width: 800px; margin: auto; }
        input, select { padding: 12px; margin: 10px 0; width: 100%; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-family: 'Tajawal'; }
        button { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 10px; width: 100%; cursor: pointer; font-weight: bold; }
        .list { max-height: 200px; overflow-y: auto; border: 1px solid #eee; padding: 10px; margin-top: 10px; border-radius: 10px; background: #fafafa; }
        .item { display: flex; justify-content: space-between; padding: 8px; border-bottom: 1px solid #eee; }
        .del { color: #e74c3c; cursor: pointer; font-weight: bold; }
    </style>
</head>
<body>
    <div class="box">
        <h1>لوحة تحكم حازم سالم 👑 <small style="float:left; font-size: 0.5em;"><a href="platform.html">رجوع</a></small></h1>
        <h3>إضافة محتوى</h3>
        <select id="sub"><option>كيمياء</option><option>فيزياء</option><option>رياضيات</option><option>أحياء</option><option>لغة عربية</option><option>تربية دينية</option></select>
        <input type="text" id="tit" placeholder="اسم الملف">
        <input type="text" id="lnk" placeholder="رابط الـ PDF">
        <button onclick="add()">رفع الآن 🚀</button>

        <h3>الطلاب المسجلين (<span id="count">0</span>)</h3>
        <div class="list" id="users"></div>

        <h3>المواد الحالية</h3>
        <div id="courses"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp({apiKey: "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4", authDomain: "hazoma-60ed2.firebaseapp.com", databaseURL: "https://hazoma-60ed2-default-rtdb.firebaseio.com", projectId: "hazoma-60ed2", storageBucket: "hazoma-60ed2.firebasestorage.app", messagingSenderId: "962438384604", appId: "1:962438384604:web:52db16e5723a8f6d3bdd19", measurementId: "G-BWQ5CZR50F"});
        const db = firebase.database();

        function add() {
            const s = document.getElementById('sub').value; const t = document.getElementById('tit').value; const l = document.getElementById('lnk').value;
            if(!t || !l) return alert("اكمل البيانات!");
            const ref = db.ref('courses').child(s);
            ref.update({ name: s });
            ref.child('files').push({ title: t, link: l });
            alert("تم الرفع!");
        }

        db.ref('students').on('value', snap => {
            const uBox = document.getElementById('users'); uBox.innerHTML = ''; let c = 0;
            snap.forEach(u => { uBox.innerHTML += `<div>👤 ${u.val().name}</div>`; c++; });
            document.getElementById('count').innerText = c;
        });

        db.ref('courses').on('value', snap => {
            const cBox = document.getElementById('courses'); cBox.innerHTML = '';
            snap.forEach(c => { cBox.innerHTML += `<div class="item"><b>${c.key}</b> <span class="del" onclick="del('${c.key}')">حذف</span></div>`; });
        });

        function del(k) { if(confirm("حذف المادة؟")) db.ref('courses/'+k).remove(); }
    </script>
</body>
</html>
