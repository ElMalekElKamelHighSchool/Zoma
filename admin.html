<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>لوحة التحكم المطورة | حازم سالم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #1a2a6c; --secondary: #b21f1f; --success: #27ae60; --info: #2980b9; --bg: #f4f7f6; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); margin: 0; display: flex; }
        
        /* Sidebar */
        .sidebar { width: 260px; background: var(--primary); height: 100vh; color: white; position: fixed; padding: 20px; box-sizing: border-box; transition: 0.3s; }
        .sidebar h2 { font-size: 1.4rem; text-align: center; margin-bottom: 30px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; color: #fdbb2d; }
        .nav-btn { width: 100%; padding: 15px; background: none; border: none; color: white; text-align: right; font-family: 'Tajawal'; cursor: pointer; border-radius: 12px; margin-bottom: 10px; transition: 0.3s; font-size: 1rem; }
        .nav-btn:hover, .nav-btn.active { background: rgba(255,255,255,0.15); color: #fdbb2d; box-shadow: inset 5px 0 0 #fdbb2d; }
        .nav-btn i { margin-left: 10px; width: 20px; }

        /* Main Content */
        .main-content { margin-right: 260px; width: calc(100% - 260px); padding: 30px; box-sizing: border-box; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: white; padding: 20px; border-radius: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.03); }
        
        .card { background: white; padding: 25px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); margin-bottom: 25px; border: 1px solid #edf2f7; }
        .section { display: none; }
        .section.active { display: block; animation: fadeIn 0.4s ease-out; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

        /* Forms & Controls */
        input, select, textarea { width: 100%; padding: 14px; margin: 8px 0; border-radius: 12px; border: 2px solid #eee; font-family: 'Tajawal'; box-sizing: border-box; transition: 0.3s; font-size: 0.95rem; }
        input:focus, select:focus { border-color: var(--primary); outline: none; background: #fff; }
        
        .btn-group { display: flex; gap: 10px; margin-top: 10px; }
        .action-btn { flex: 1; padding: 14px; border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-family: 'Tajawal'; transition: 0.3s; color: white; }
        .btn-save { background: var(--success); }
        .btn-update { background: var(--info); display: none; }
        .btn-cancel { background: #95a5a6; display: none; }
        .action-btn:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Tables & Lists */
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 15px; overflow: hidden; }
        th { background: #f8f9fa; padding: 18px; text-align: right; color: var(--primary); border-bottom: 2px solid #eee; }
        td { padding: 15px; border-bottom: 1px solid #f1f1f1; }
        
        .course-box { background: #fff; border: 1px solid #e2e8f0; border-radius: 15px; padding: 20px; margin-bottom: 20px; }
        .course-title { display: flex; align-items: center; justify-content: space-between; border-bottom: 2px solid #f1f1f1; margin-bottom: 15px; padding-bottom: 10px; color: var(--primary); }
        
        .item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; background: #f8fafc; margin-bottom: 8px; border-radius: 10px; transition: 0.2s; }
        .item-row:hover { background: #f1f5f9; }
        .controls i { cursor: pointer; margin-right: 15px; font-size: 1.1rem; transition: 0.2s; }
        .fa-edit { color: var(--info); }
        .fa-trash-alt { color: var(--secondary); }
    </style>
</head>
<body>

    <div class="sidebar">
        <h2>حازم سالم 👑</h2>
        <button class="nav-btn active" onclick="showSec('stats')"><i class="fas fa-th-large"></i> لوحة الإحصائيات</button>
        <button class="nav-btn" onclick="showSec('students')"><i class="fas fa-user-graduate"></i> سجل الطلاب</button>
        <button class="nav-btn" onclick="showSec('manage')"><i class="fas fa-edit"></i> إدارة المحتوى</button>
        <button class="nav-btn" onclick="location.href='courses.html'"><i class="fas fa-home"></i> رجوع للمنصة</button>
    </div>

    <div class="main-content">
        <div class="header-bar">
            <h1>مرحباً بك يا مستشار</h1>
            <div id="clock" style="font-weight: 700; color: var(--primary);"></div>
        </div>

        <div id="stats" class="section active">
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px;">
                <div class="card" style="border-right: 5px solid var(--primary);">
                    <h3 style="color:#666">إجمالي الطلاب</h3>
                    <h1 id="countStds" style="color: var(--primary); font-size: 2.5rem;">0</h1>
                </div>
                <div class="card" style="border-right: 5px solid var(--secondary);">
                    <h3 style="color:#666">الكورسات المتاحة</h3>
                    <h1 id="countCourses" style="color: var(--secondary); font-size: 2.5rem;">0</h1>
                </div>
                <div class="card" style="border-right: 5px solid var(--success);">
                    <h3 style="color:#666">إجمالي الدروس</h3>
                    <h1 id="countItems" style="color: var(--success); font-size: 2.5rem;">0</h1>
                </div>
            </div>
        </div>

        <div id="students" class="section">
            <div class="card">
                <h3>👥 قائمة الطلاب المسجلين</h3>
                <table>
                    <thead>
                        <tr>
                            <th>الاسم</th>
                            <th>تاريخ أول دخول</th>
                        </tr>
                    </thead>
                    <tbody id="stdsTable"></tbody>
                </table>
            </div>
        </div>

        <div id="manage" class="section">
            <div class="card">
                <h3 id="formTitle">✨ إضافة محتوى جديد</h3>
                <input type="hidden" id="editKey"> <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                    <div>
                        <label>اختر المادة:</label>
                        <select id="selCourse">
                            <option value="كيمياء">كيمياء</option><option value="فيزياء">فيزياء</option>
                            <option value="عربي">لغة عربية</option><option value="رياضيات">رياضيات</option>
                            <option value="أحياء">أحياء</option><option value="دين">تربية دينية</option>
                        </select>
                        <input type="text" id="itemName" placeholder="اسم الدرس (مثال: المحاضرة الأولى)">
                        <input type="text" id="itemLink" placeholder="رابط الملف أو الفيديو">
                    </div>
                    <div>
                        <label>رفع جماعي (إكسيل):</label>
                        <textarea id="bulkData" placeholder="اسم الدرس [مسافة Tab] الرابط"></textarea>
                    </div>
                </div>

                <div class="btn-group">
                    <button id="btnSave" class="action-btn btn-save" onclick="saveItem()">حفظ الدرس 🚀</button>
                    <button id="btnUpdate" class="action-btn btn-update" onclick="updateItem()">تحديث البيانات ✅</button>
                    <button id="btnCancel" class="action-btn btn-cancel" onclick="clearForm()">إلغاء</button>
                    <button class="action-btn" style="background:#8e44ad" onclick="saveBulk()">رفع الإكسيل 📊</button>
                </div>
            </div>

            <div id="coursesDisplay"></div>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4", authDomain: "hazoma-60ed2.firebaseapp.com", databaseURL: "https://hazoma-60ed2-default-rtdb.firebaseio.com", projectId: "hazoma-60ed2", storageBucket: "hazoma-60ed2.firebasestorage.app", messagingSenderId: "962438384604", appId: "1:962438384604:web:52db16e5723a8f6d3bdd19", measurementId: "G-BWQ5CZR50F" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // تحديث الساعة
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString('ar-EG'); }, 1000);

        function showSec(id) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        // جلب البيانات الأساسية
        db.ref('students').on('value', snap => {
            const table = document.getElementById('stdsTable'); table.innerHTML = '';
            document.getElementById('countStds').innerText = snap.numChildren();
            snap.forEach(s => {
                table.innerHTML += `<tr><td>👤 ${s.val().name}</td><td>${new Date(s.val().time).toLocaleDateString('ar-EG')}</td></tr>`;
            });
        });

        // حفظ درس منفرد
        function saveItem() {
            const course = document.getElementById('selCourse').value;
            const name = document.getElementById('itemName').value;
            const link = document.getElementById('itemLink').value;
            if(!name || !link) return alert("من فضلك ادخل الاسم والرابط");
            db.ref(`courses/${course}/items`).push({ name, link });
            alert("تم الحفظ بنجاح!"); clearForm();
        }

        // رفع جماعي من إكسيل
        function saveBulk() {
            const course = document.getElementById('selCourse').value;
            const text = document.getElementById('bulkData').value;
            if(!text) return alert("انسخ بيانات الإكسيل أولاً");
            const lines = text.split('\n');
            lines.forEach(line => {
                const parts = line.split('\t');
                if(parts.length >= 2) db.ref(`courses/${course}/items`).push({ name: parts[0].trim(), link: parts[1].trim() });
            });
            alert("تم رفع القائمة بنجاح!"); document.getElementById('bulkData').value = '';
        }

        // عرض الكورسات والدروس
        db.ref('courses').on('value', snap => {
            const display = document.getElementById('coursesDisplay'); display.innerHTML = '';
            let totalItems = 0;
            document.getElementById('countCourses').innerText = snap.numChildren();

            snap.forEach(courseSnap => {
                const courseName = courseSnap.key;
                let itemsHtml = '';
                courseSnap.child('items').forEach(itemSnap => {
                    totalItems++;
                    const item = itemSnap.val();
                    itemsHtml += `
                        <div class="item-row">
                            <span><i class="fas fa-file-alt"></i> ${item.name}</span>
                            <div class="controls">
                                <i class="fas fa-edit" onclick="setupEdit('${courseName}', '${itemSnap.key}', '${item.name}', '${item.link}')"></i>
                                <i class="fas fa-trash-alt" onclick="deleteItem('${courseName}', '${itemSnap.key}')"></i>
                            </div>
                        </div>`;
                });

                display.innerHTML += `
                    <div class="course-box">
                        <div class="course-title">
                            <h3>📦 مادة: ${courseName}</h3>
                            <span class="badge" style="background:var(--primary); color:white; padding:5px 15px; border-radius:20px; font-size:0.8rem;">${courseSnap.child('items').numChildren()} درس</span>
                        </div>
                        ${itemsHtml || '<p style="color:#999; text-align:center;">لا توجد دروس هنا بعد</p>'}
                    </div>`;
            });
            document.getElementById('countItems').innerText = totalItems;
        });

        // تحضير التعديل
        function setupEdit(course, key, name, link) {
            document.getElementById('formTitle').innerText = "📝 تعديل الدرس الحالي";
            document.getElementById('selCourse').value = course;
            document.getElementById('itemName').value = name;
            document.getElementById('itemLink').value = link;
            document.getElementById('editKey').value = key;
            
            document.getElementById('btnSave').style.display = 'none';
            document.getElementById('btnUpdate').style.display = 'block';
            document.getElementById('btnCancel').style.display = 'block';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // تنفيذ التحديث
        function updateItem() {
            const course = document.getElementById('selCourse').value;
            const name = document.getElementById('itemName').value;
            const link = document.getElementById('itemLink').value;
            const key = document.getElementById('editKey').value;
            
            db.ref(`courses/${course}/items/${key}`).update({ name, link }).then(() => {
                alert("تم التحديث بنجاح!");
                clearForm();
            });
        }

        function deleteItem(course, key) {
            if(confirm("هل تريد حذف هذا الدرس نهائياً؟")) db.ref(`courses/${course}/items/${key}`).remove();
        }

        function clearForm() {
            document.getElementById('formTitle').innerText = "✨ إضافة محتوى جديد";
            document.getElementById('itemName').value = '';
            document.getElementById('itemLink').value = '';
            document.getElementById('editKey').value = '';
            document.getElementById('btnSave').style.display = 'block';
            document.getElementById('btnUpdate').style.display = 'none';
            document.getElementById('btnCancel').style.display = 'none';
        }
    </script>
</body>
</html>
