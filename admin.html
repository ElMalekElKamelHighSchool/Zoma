<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | حازم سالم</title>
    <style>
        body { font-family: 'Tajawal'; padding: 20px; background: #eee; }
        .admin-box { background: white; padding: 25px; border-radius: 20px; max-width: 900px; margin: auto; }
        textarea { width: 100%; height: 100px; padding: 10px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; }
        .bulk-info { font-size: 0.8rem; color: #666; background: #fffde7; padding: 10px; border-radius: 10px; border: 1px solid #ffe082; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: right; }
        .btn-add { background: #27ae60; color: white; border: none; padding: 10px 20px; border-radius: 10px; cursor: pointer; }
    </style>
</head>
<body>
    <div class="admin-box">
        <h1>إدارة المنصة 👑 <small style="float:left"><a href="courses.html">خروج</a></small></h1>
        
        <div style="display:grid; gap:10px; background:#f9f9f9; padding:20px; border-radius:15px;">
            <h3>إضافة/تحديث كورس</h3>
            <select id="courseSelect">
                <option value="كيمياء">كيمياء</option>
                <option value="فيزياء">فيزياء</option>
                <option value="عربي">لغة عربية</option>
                <option value="رياضيات">رياضيات</option>
            </select>
            
            <p class="bulk-info"><b>الرفع الجماعي من إكسيل:</b> انسخ العمودين من إكسيل (الاسم، اللينك) والصقهم هنا.</p>
            <textarea id="bulkData" placeholder="اسم الدرس [مسافة/Tab] اللينك"></textarea>
            
            <label><input type="radio" name="type" value="pdf" checked> ملفات PDF</label>
            <label><input type="radio" name="type" value="video"> فيديوهات يوتيوب</label>
            
            <button class="btn-add" onclick="bulkUpload()">رفع البيانات الآن 🚀</button>
        </div>

        <h3>الطلاب المسجلين</h3>
        <div id="stds" style="background:#fff; height:150px; overflow-y:auto; padding:10px; border:1px solid #ddd;"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function bulkUpload() {
            const courseName = document.getElementById('courseSelect').value;
            const rawData = document.getElementById('bulkData').value;
            const type = document.querySelector('name="type"]:checked').value;
            
            if(!rawData) return alert("انسخ البيانات من إكسيل أولاً!");

            const rows = rawData.split('\n');
            const courseRef = db.ref('courses').child(courseName);
            courseRef.update({ name: courseName });

            rows.forEach(row => {
                const parts = row.split('\t'); // التقسيم بناءً على Tab (زي الإكسيل)
                if(parts.length >= 2) {
                    courseRef.child('items').push({
                        title: parts[0].trim(),
                        link: parts[1].trim(),
                        type: type
                    });
                }
            });
            alert("تم الرفع بنجاح يا حازم!");
            document.getElementById('bulkData').value = '';
        }

        db.ref('students').on('value', snap => {
            const div = document.getElementById('stds'); div.innerHTML = '';
            snap.forEach(s => div.innerHTML += `<div>👤 ${s.val().name}</div>`);
        });
    </script>
</body>
</html>
