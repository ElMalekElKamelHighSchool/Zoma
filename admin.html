<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم | حازم سالم</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal'; background: #f0f2f5; padding: 20px; direction: rtl; }
        .admin-card { background: white; padding: 30px; border-radius: 20px; max-width: 900px; margin: auto; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        .form-box { display: grid; gap: 15px; background: #f9f9f9; padding: 20px; border-radius: 15px; margin-bottom: 30px; }
        input, select { padding: 12px; border-radius: 10px; border: 1px solid #ddd; font-family: 'Tajawal'; }
        button { background: #27ae60; color: white; border: none; padding: 12px; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .student-item { background: #fff; border: 1px solid #eee; padding: 10px; margin: 5px; border-radius: 8px; display: inline-block; font-size: 0.8rem; }
        .course-item { display: flex; justify-content: space-between; padding: 10px; border-bottom: 1px solid #eee; }
        .del-btn { color: #e74c3c; cursor: pointer; }
    </style>
</head>
<body>

<div class="admin-card">
    <h1>لوحة تحكم حازم سالم 👑</h1>
    
    <div class="form-box">
        <h3>إضافة ملف جديد</h3>
        <select id="cName">
            <option value="كيمياء">كيمياء</option>
            <option value="فيزياء">فيزياء</option>
            <option value="عربي">لغة عربية</option>
            <option value="دين">تربية دينية</option>
            <option value="أحياء">أحياء</option>
            <option value="رياضيات">رياضيات</option>
        </select>
        <input type="text" id="fTitle" placeholder="اسم الملف (مثلاً: الفصل الأول)">
        <input type="text" id="fUrl" placeholder="رابط الـ PDF">
        <button onclick="saveFile()">رفع للمنصة الآن 🚀</button>
    </div>

    <div class="form-box">
        <h3>الطلاب المسجلين (<span id="sCount">0</span>)</h3>
        <div id="studentsList"></div>
    </div>

    <div class="form-box">
        <h3>إدارة المحتوى</h3>
        <div id="coursesList"></div>
    </div>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function saveFile() {
        const name = document.getElementById('cName').value;
        const title = document.getElementById('fTitle').value;
        const url = document.getElementById('fUrl').value;
        if(!title || !url) return alert("املأ البيانات!");

        const ref = db.ref('courses').child(name);
        ref.update({ name: name });
        ref.child('files').push({ title: title, url: url });
        alert("تم الرفع!");
    }

    db.ref('students').on('value', snap => {
        document.getElementById('sCount').innerText = snap.numChildren();
        const list = document.getElementById('studentsList');
        list.innerHTML = '';
        snap.forEach(s => {
            list.innerHTML += `<span class="student-item">${s.val().name}</span>`;
        });
    });

    db.ref('courses').on('value', snap => {
        const list = document.getElementById('coursesList');
        list.innerHTML = '';
        snap.forEach(cSnap => {
            const c = cSnap.val();
            list.innerHTML += `
                <div class="course-item">
                    <span><strong>${c.name}</strong></span>
                    <span class="del-btn" onclick="deleteCourse('${c.name}')"><i class="fas fa-trash"></i> حذف المادة</span>
                </div>
            `;
        });
    });

    function deleteCourse(name) { if(confirm("حذف؟")) db.ref('courses/'+name).remove(); }
</script>
</body>
</html>
