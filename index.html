<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>بوابة حازم سالم | 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri&display=swap" rel="stylesheet">
    <style>
        :root { --main: #1a2a6c; --accent: #fdbb2d; }
        body { font-family: 'Tajawal', sans-serif; margin: 0; background: linear-gradient(135deg, #1a2a6c, #b21f1f, #fdbb2d); height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; }
        .card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); text-align: center; color: white; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); transition: 0.5s; }
        input { width: 100%; padding: 15px; border-radius: 15px; border: none; margin-top: 20px; text-align: center; font-size: 1.1rem; outline: none; box-sizing: border-box; }
        .btn { background: var(--accent); color: #1a2a6c; border: none; padding: 15px; border-radius: 15px; width: 100%; margin-top: 20px; font-weight: 900; cursor: pointer; transition: 0.3s; font-size: 1.2rem; }
        #overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
        .quran { font-family: 'Amiri', serif; font-size: 2.5rem; color: #27ae60; margin-bottom: 20px; }
    </style>
</head>
<body>
    <audio id="praySnd" src="https://www.islamcan.com/audio/dua/salawat.mp3"></audio>
    <div id="overlay">
        <div class="quran" id="verse"></div>
        <div style="font-size: 1.3rem; color: #34495e;">
            <b>صلي على محمد ﷺ</b><br>
            بشراك بالخير.. استعن بالله<br>
            <small style="color: #e74c3c;">(الْبَخِيلُ مَنْ ذُكِرْتُ عِنْدَهُ فَلَمْ يُصَلِّ عَلَيَّ)</small>
        </div>
    </div>

    <div class="card">
        <i class="fas fa-heart" style="color: #ff4757; font-size: 3.5rem; margin-bottom: 20px;"></i>
        <h1>مساء الخير يا حُب ❤️</h1>
        <p>العمل لوجه الله تعالى.. لو استفدت متنسونيش من دعواتكم 🙏</p>
        <p><b>أخوكم حازم سالم</b></p>
        <input type="text" id="uName" placeholder="سجل اسمك يا بطل...">
        <button class="btn" onclick="start()">دخول للمنصة ✨</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4", authDomain: "hazoma-60ed2.firebaseapp.com", databaseURL: "https://hazoma-60ed2-default-rtdb.firebaseio.com", projectId: "hazoma-60ed2", storageBucket: "hazoma-60ed2.firebasestorage.app", messagingSenderId: "962438384604", appId: "1:962438384604:web:52db16e5723a8f6d3bdd19", measurementId: "G-BWQ5CZR50F" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        if(localStorage.getItem('zoma_user')) window.location.href="courses.html";

        function start() {
            const name = document.getElementById('uName').value.trim();
            if(!name) return alert("اكتب اسمك يا حُب!");
            db.ref('students').push({ name: name, time: Date.now() });
            localStorage.setItem('zoma_user', name);
            
            const v = ["إِنَّ مَعَ الْعُسْرِ يُسْرًا", "وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا", "وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا"];
            document.getElementById('verse').innerText = v[Math.floor(Math.random()*v.length)];
            document.getElementById('overlay').style.display = 'flex';
            document.getElementById('praySnd').play();
            setTimeout(() => window.location.href="courses.html", 3500);
        }
    </script>
</body>
</html>
