<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة حازم سالم | 2026</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Amiri&display=swap" rel="stylesheet">
    <style>
        :root { --main: #1e3c72; --gold: #f1c40f; }
        body { font-family: 'Tajawal', sans-serif; margin: 0; background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%); height: 100vh; display: flex; align-items: center; justify-content: center; }
        .login-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px); padding: 40px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.2); text-align: center; color: white; width: 90%; max-width: 400px; box-shadow: 0 20px 50px rgba(0,0,0,0.3); }
        input { width: 100%; padding: 15px; border-radius: 15px; border: none; margin-top: 20px; text-align: center; font-size: 1.1rem; outline: none; }
        .btn { background: var(--gold); color: #1e3c72; border: none; padding: 15px; border-radius: 15px; width: 100%; margin-top: 20px; font-weight: 900; cursor: pointer; transition: 0.3s; }
        .overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: white; z-index: 9999; display: none; flex-direction: column; align-items: center; justify-content: center; }
        .quran { font-family: 'Amiri', serif; font-size: 2.2rem; color: #27ae60; margin-bottom: 20px; text-align: center; }
    </style>
</head>
<body>
    <audio id="salawat" src="https://www.islamcan.com/audio/dua/salawat.mp3"></audio>
    <div class="overlay" id="loader">
        <div class="quran" id="verse"></div>
        <div style="font-size: 1.2rem; color: #34495e; text-align: center;">
            <b>صلي على محمد ﷺ</b><br>بشراك بكل خير يا بطل
        </div>
    </div>

    <div class="login-card">
        <i class="fas fa-heart" style="color: #ff4757; font-size: 3rem; margin-bottom: 15px;"></i>
        <h2>مساء الخير يا حُب ❤️</h2>
        <p>العمل لوجه الله تعالى.. لو استفدت متنسونيش من دعواتكم 🙏 <br> <b>أخوكم حازم سالم</b></p>
        <input type="text" id="uName" placeholder="سجل اسمك هنا...">
        <button class="btn" onclick="start()">دخول للمنصة ✨</button>
    </div>

    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script>
        const firebaseConfig = { apiKey: "AIzaSyCSwNiOHDC0m6zoBx_BeAGyaE33Zmhuvi4", authDomain: "hazoma-60ed2.firebaseapp.com", databaseURL: "https://hazoma-60ed2-default-rtdb.firebaseio.com", projectId: "hazoma-60ed2", storageBucket: "hazoma-60ed2.firebasestorage.app", messagingSenderId: "962438384604", appId: "1:962438384604:web:52db16e5723a8f6d3bdd19", measurementId: "G-BWQ5CZR50F" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        if(localStorage.getItem('zoma_user')) window.location.href="courses.html";

        function start() {
            const n = document.getElementById('uName').value.trim();
            if(!n) return alert("اكتب اسمك يا حُب!");

            db.ref('students').orderByChild('name').equalTo(n).once('value', s => {
                if(!s.exists()) db.ref('students').push({ name: n, time: Date.now() });
                localStorage.setItem('zoma_user', n);
                showLoader();
            });
        }

        function showLoader() {
            const v = ["إِنَّ مَعَ الْعُسْرِ يُسْرًا", "وَاصْبِرْ لِحُكْمِ رَبِّكَ فَإِنَّكَ بِأَعْيُنِنَا", "وَمَنْ يَتَّقِ اللَّهَ يَجْعَلْ لَهُ مَخْرَجًا"];
            document.getElementById('verse').innerText = v[Math.floor(Math.random()*v.length)];
            document.getElementById('loader').style.display = 'flex';
            document.getElementById('salawat').play();
            setTimeout(() => window.location.href="courses.html", 3500);
        }
    </script>
</body>
</html>
